<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>First Forward &amp; Gv Partner Dashboard</title>
  <meta name="description" content="First Forward + GV Partner FASTag dashboard — issuance, stock, trends and agent performance.">
  <meta name="theme-color" content="#111214">
  <link rel="manifest" href="manifest.webmanifest">
  <link id="site-favicon" rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=5">
  <link rel="apple-touch-icon" href="icon-192.png?v=5">
  <link rel="stylesheet" href="styles.css?v=38">
  <script>try { if (localStorage.getItem('ff_theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
</head>
<body>
  <div id="app-boot" class="app-boot" role="status" aria-live="polite">
    <img src="logos/apna-payment.png" alt="ApnaPayment" width="280" height="153">
    <p>Opening your workspace…</p><small>Checking your secure session…</small>
    <div class="boot-progress"></div>
  </div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo" id="brand-logo">FF</div>
      <div class="brand-text"><b id="brand-name">First Forward</b><small id="brand-tag">Dashboard</small></div>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="side-foot">
      <div id="status" class="status"><span class="dot"></span> Ready</div>
      <div id="user-box"></div>
    </div>
  </aside>
  <div class="side-backdrop" id="side-backdrop"></div>

  <div class="content">
    <header class="topbar">
      <button class="icon-btn" id="menu-btn" aria-label="Menu">☰</button>
      <div class="top-title" id="top-title">Dashboard</div>
      <div class="top-actions" id="top-actions">
        <button class="btn small primary" id="pwa-install" hidden title="Install app">⬇️ Install App</button>
        <button class="icon-btn" id="lang-toggle" title="Language · भाषा (English / हिंदी)" aria-label="Language">🌐</button>
        <button class="icon-btn" id="theme-toggle" title="Dark / light mode" aria-label="Theme">🌙</button>
        <button class="icon-btn" id="top-refresh" title="Refresh data (Google Sheet se naya data)" aria-label="Refresh">↻</button>
        <button class="icon-btn" id="save-view-btn" title="Save current filtered view" aria-label="Save current view">☆</button>
        <button class="icon-btn" id="global-search-btn" title="Global search (Ctrl / ⌘ + K)" aria-label="Search">🔍</button>
        <div class="notification-wrap">
          <button class="icon-btn notification-btn" id="notification-btn" title="Notifications" aria-label="Notifications" aria-expanded="false">🔔<span class="notification-count" id="notification-count" hidden>0</span></button>
          <div class="notification-pop" id="notification-pop" hidden></div>
        </div>
        <div class="user-wrap">
          <button class="user-btn" id="user-btn" aria-haspopup="true" aria-expanded="false"></button>
          <div class="user-menu" id="user-menu" hidden></div>
        </div>
      </div>
    </header>
    <main id="main" class="main"></main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="drawer-head-main"><div class="drawer-kicker" id="drawer-kicker"></div><h2 id="drawer-title"></h2><div class="drawer-sub" id="drawer-sub"></div><div class="drawer-actions" id="drawer-actions"></div></div>
      <button class="icon-btn" id="drawer-close" aria-label="Close">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script defer src="config.js?v=38"></script>
  <script defer src="util.js?v=38"></script>
  <script defer src="xlsx.js?v=38"></script>
  <script defer src="data.js?v=38"></script>
  <script defer src="charts.js?v=38"></script>
  <script defer src="model.js?v=38"></script>
  <script defer src="store.js?v=38"></script>
  <script defer src="gv.js?v=38"></script>
  <script defer src="directAgents.js?v=38"></script>
  <script defer src="masterProfile.js?v=38"></script>
  <script defer src="newAgents.js?v=38"></script>
  <script defer src="preload.js?v=38"></script>
  <script defer src="auth.js?v=38"></script>
  <script defer src="notifications.js?v=38"></script>
  <script defer src="sheets.js?v=38"></script>
  <script defer src="dashboard.js?v=38"></script>
  <script defer src="trend.js?v=38"></script>
  <script defer src="stock.js?v=38"></script>
  <script defer src="performance.js?v=38"></script>
  <script defer src="home.js?v=38"></script>
  <script defer src="gvpages.js?v=38"></script>
  <script defer src="compare.js?v=38"></script>
  <script defer src="tagIssued.js?v=38"></script>
  <script defer src="chartExplorer.js?v=38"></script>
  <script defer src="kpiDetail.js?v=38"></script>
  <script defer src="liveView.js?v=38"></script>
  <script defer src="settings.js?v=38"></script>
  <script defer src="targets.js?v=38"></script>
  <script defer src="tv.js?v=38"></script>
  <script defer src="map.js?v=38"></script>
  <script defer src="rangeReport.js?v=38"></script>
  <script defer src="certificates.js?v=38"></script>
  <script defer src="insights.js?v=38"></script>
  <script defer src="cockpit.js?v=38"></script>
  <script defer src="dispatchPlanner.js?v=38"></script>
  <script defer src="wow.js?v=38"></script>
  <script defer src="wowzone.js?v=38"></script>
  <script defer src="masterSearch.js?v=38"></script>
  <script defer src="assistant.js?v=38"></script>
  <script defer src="morningCard.js?v=38"></script>
  <script defer src="officeBell.js?v=38"></script>
  <script defer src="sprints.js?v=38"></script>
  <script defer src="stockRadar.js?v=38"></script>
  <script defer src="app.js?v=38"></script>
  <script defer src="palette.js?v=38"></script>
</body>
</html>
