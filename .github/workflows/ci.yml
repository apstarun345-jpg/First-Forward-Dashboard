name: Dashboard CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Syntax check all dashboard modules
        run: npm run check
      - name: Run targeted Tag Request idempotency regression
        run: node --test dev/tag-request-idempotency.test.js
      - name: Run full regression suite
        run: npm test
