# This blueprint preserves file-mode storage. For encrypted storage in the SAME Google Sheet,
# follow SHEETS_STORAGE.md and configure the existing service secrets after migration.
# Do not remove an existing disk automatically; verify backups and the cloud migration first.
# Render Blueprint: "New +" → "Blueprint" → select this repo. Or create a Web Service manually (see README).
services:
  - type: web
    name: first-forward-dashboard
    runtime: node
    plan: starter
    buildCommand: ""
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CACHE_SECONDS
        value: "300"
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Permanent storage in Google Sheet (see STORAGE_SETUP.md) — set both in the Render dashboard
      - key: APPS_SCRIPT_URL
        sync: false
      - key: APPS_SCRIPT_SECRET
        sync: false
      # Persistent disk mount — isse har deploy par users/settings reset nahi honge
      - key: DATA_DIR
        value: "/data"
      # 📲 Mobile push (OS notification panel): VAPID keys durable rehni chahiye. Disk + cloud storage
      # dono me keys save hoti hain; env se pin karna optional hai (multi-instance ke liye recommended).
      # Ek baar `npm run push:keys` chalao aur dono values Render → Environment me paste kar do:
      # isse applicationServerKey kabhi nahi badlega aur phone ki subscriptions hamesha kaam karengi.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Optional: VAPID JWT ka contact claim (default mailto:admin@apnapayment.com). localhost/.local mat dena.
      # Optional: PUSH_AUTH_SCHEME=legacy — sirf agar koi push service RFC 8292 "vapid" scheme na samjhe
      #   (server khud automatic fallback karta hai, isliye normally iski zaroorat nahi).
      - key: PUSH_TTL_SECONDS
        value: "86400"
    disk:
      name: ffdata
      mountPath: /data
      sizeGB: 1
